<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Side Projects - Nidhi Shandilya</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #fafafa;
            color: #333;
            line-height: 1.8;
            font-size: 15px;
            font-weight: 300;
        }
        
        /* Generous whitespace */
        .nav-header {
            padding: 60px 40px;
        }
        
        .nav-container {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .site-title {
            font-size: 15px;
            font-weight: 300;
            color: #000;
            text-decoration: none;
            letter-spacing: 0.02em;
        }
        
        .nav-links {
            display: flex;
            gap: 40px;
            list-style: none;
        }
        
        .nav-links a {
            color: #888;
            text-decoration: none;
            font-size: 15px;
            font-weight: 300;
            transition: color 0.3s ease;
        }
        
        .nav-links a:hover {
            color: #000;
        }
        
        /* Main content with breathing room */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 100px 40px 120px;
        }
        
        .page-header {
            margin-bottom: 120px;
        }
        
        .page-header h1 {
            font-size: 16px;
            font-weight: 300;
            color: #000;
            margin-bottom: 0;
            letter-spacing: 0.05em;
        }
        
        .project-list {
            display: flex;
            flex-direction: column;
            gap: 120px;
        }
        
        .project {
            opacity: 0;
            animation: fadeIn 0.8s ease-out forwards;
        }
        
        .project:nth-child(2) {
            animation-delay: 0.2s;
        }
        
        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }
