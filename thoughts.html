    <!-- Dot grid background -->
    <canvas id="dot-bg" style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;pointer-events:none;background:#131312;"></canvas>
    <script>
        (function() {
            const canvas = document.getElementById('dot-bg');
            const ctx = canvas.getContext('2d');
            const spacing = 24;
            let dots = [];

            function buildDots() {
                dots = [];
                const cols = Math.ceil(canvas.width / spacing) + 1;
                const rows = Math.ceil(canvas.height / spacing) + 1;
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        dots.push({
                            x: c * spacing + spacing / 2,
                            y: r * spacing + spacing / 2,
                            delay: Math.random() * 3500
                        });
                    }
                }
            }

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                buildDots();
            }
            resize();
            window.addEventListener('resize', resize);

            const start = performance.now();
            const fadeDuration = 900;

            function draw(now) {
                ctx.fillStyle = '#131312';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                for (const d of dots) {
                    const elapsed = now - start - d.delay;
                    if (elapsed < 0) continue;
                    const alpha = Math.min(1, elapsed / fadeDuration) * 0.45;
                    ctx.beginPath();
                    ctx.arc(d.x, d.y, 1.4, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
                    ctx.fill();
                }
                requestAnimationFrame(draw);
            }
            requestAnimationFrame(draw);
        })();
    </script>

    <script src="script.js"></script>
</body>
