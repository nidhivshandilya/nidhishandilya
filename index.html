<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nidhi Shandilya</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #fafafa;
            color: #333;
            line-height: 1.8;
            font-size: 15px;
            font-weight: 300;
        }
        
        /* Navigation with separator line */
        .nav-header {
            padding: 40px 15px;
            border-bottom: 1px solid #e8e8e8;
        }
        
        .nav-container {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .site-title {
            font-size: 15px;
            font-weight: 300;
            color: #000;
            text-decoration: none;
            letter-spacing: 0.02em;
        }
        
        .nav-links {
            display: flex;
            gap: 40px;
            list-style: none;
        }
        
        .nav-links a {
            color: #888;
            text-decoration: none;
            font-size: 15px;
            font-weight: 300;
            transition: color 0.3s ease;
        }
        
        .nav-links a:hover {
            color: #000;
        }
        
        /* Main content */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 100px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        
        .profile-image {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            margin-bottom: 60px;
            object-fit: cover;
            border: 1px solid #e8e8e8;
        }
        
        .intro {
            max-width: 600px;
        }
        
        .intro h1 {
            font-size: 20px;
            font-weight: 300;
            color: #000;
            line-height: 1.8;
            letter-spacing: 0.02em;
            margin: 0;
        }
        
        @media (max-width: 768px) {
            .nav-header {
                padding: 40px 20px;
            }
            
            .nav-container {
                flex-direction: column;
                gap: 30px;
                align-items: flex-start;
            }
            
            .nav-links {
                gap: 30px;
            }
            
            .container {
                padding: 60px 20px;
            }
            
            .profile-image {
                width: 140px;
                height: 140px;
                margin-bottom: 40px;
            }
            
            .intro h1 {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <nav class="nav-header">
        <div class="nav-container">
            <a href="index.html" class="site-title">Nidhi Shandilya</a>
            <ul class="nav-links">
                <li><a href="thoughts.html">Thoughts</a></li>
                <li><a href="projects.html">Side projects</a></li>
                <li><a href="about.html">About</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <img src="screenshot.jpeg.png" alt="Nidhi Shandilya" class="profile-image">
        
        <div class="intro">
            <h1>I'm a product maker who loves imagining and bringing new concepts to life. The biggest and root concept is the concept of "I".</h1>
        </div>
    </div>
</body>
</html>
